[package]
name = "taara-editor"
version = "0.1.0"
description = "Taara Editor - lightweight code editor for embedded developers"
authors = ["Taara MCU team"]
edition = "2021"
license = "MIT"

[lib]
name = "taara_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
globset = "0.4"
ignore = "0.4"
portable-pty = "0.9"
regex = "1"
# ring instead of the default aws-lc-rs: no NASM/CMake needed to build on Windows.
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "4"
tokio = { version = "1", features = ["sync", "time", "io-util"] }
sha2 = "0.10"
ureq = { version = "2", features = ["json", "proxy-from-env"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
